<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>Babel Lab — Fire Visualization</title>
  <link rel="stylesheet" href="../../shared/lab.css?v=14" />
  <link rel="stylesheet" href="../fire.css?v=6" />
  <link rel="stylesheet" href="../../shared/header-reference.css?v=8" />
</head>
<body>
  <div id="app" class="lab-shell" aria-live="polite"></div>
  <script>
    (function(){
      function showBootError(message){
        var app=document.getElementById('app');
        if(!app)return;
        app.innerHTML='<div class="error-card"><strong>Fire visualization hit a JavaScript error.</strong><br><br>'+String(message)+'</div>';
      }
      window.addEventListener('error',function(e){showBootError(e.message||'Unknown script error');});
      window.addEventListener('unhandledrejection',function(e){showBootError(e.reason||'Unhandled promise error');});
    })();
  </script>
  <script src="../fire-engine.js?v=4"></script>
  <script src="../fire-app.js?v=5"></script>
</body>
</html>
