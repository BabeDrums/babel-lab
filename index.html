<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Babel Lab — World Object Grammar</title>
<style>
:root{--bg:#080809;--panel:#111114;--panel2:#17171b;--text:#f5f2ec;--muted:#aaa5a0;--quiet:#73706d;--line:rgba(255,255,255,.09);--amber:#ffad4d;--orange:#ff7932;--gold:#ffd18a;--r:20px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{background:radial-gradient(circle at 50% -10%,rgba(255,126,50,.12),transparent 34%),linear-gradient(#0c0c0e,#070708)}button,input{font:inherit}.app{width:min(100%,460px);min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 16px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;min-height:62px;position:sticky;top:0;z-index:20;background:linear-gradient(rgba(8,8,9,.96),rgba(8,8,9,.82),transparent);backdrop-filter:blur(12px)}.brand{font:600 22px Georgia,serif}.round{appearance:none;width:40px;height:40px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.025);color:var(--text);display:grid;place-items:center}.card{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));box-shadow:0 18px 50px rgba(0,0,0,.35)}.hero{position:relative;min-height:360px;overflow:hidden;background:radial-gradient(circle at 68% 45%,rgba(255,150,62,.15),transparent 36%)}.hero-copy{position:relative;z-index:3;padding:22px;max-width:68%}.hero h1,.detail h1{font-family:Georgia,serif;margin:0}.hero h1{font-size:36px}.hero p,.detail p{color:var(--muted);line-height:1.48}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.2em;font-size:11px;margin-bottom:8px}.fire-wrap{position:absolute;inset:56px 0 0;pointer-events:none}.fire-wrap canvas{width:100%;height:100%;display:block}.fire-floor{position:absolute;left:14%;right:14%;bottom:30px;height:72px;background:radial-gradient(ellipse,rgba(255,132,47,.32),rgba(255,132,47,.07) 48%,transparent 72%);filter:blur(9px)}.hero-actions{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:10px;z-index:4}.primary,.secondary{min-height:44px;border-radius:14px;padding:0 14px;border:0}.primary{flex:1;background:linear-gradient(#f4b15c,#c96a2d);color:#21150b;font-weight:750}.secondary{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text)}.section{margin-top:18px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tabs button{min-height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--muted)}.tabs button.active{color:var(--text);border-color:rgba(255,176,77,.42);background:rgba(255,145,62,.09)}.heading{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:18px 2px 10px}.heading h2{font:600 23px Georgia,serif;margin:0}.heading small{color:var(--quiet)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{appearance:none;position:relative;min-height:158px;padding:15px;text-align:left;color:var(--text);border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.012))}.art{height:78px;display:grid;place-items:center}.sigil{width:66px;height:66px;display:grid;place-items:center;font-size:37px;border-radius:20px;background:radial-gradient(circle,rgba(255,179,83,.18),transparent 68%);filter:drop-shadow(0 0 14px rgba(255,136,50,.22))}.tile strong{display:block;margin-top:7px}.tile small{display:block;color:var(--muted);margin-top:4px;line-height:1.3}.source-dot{position:absolute;right:10px;top:10px;width:27px;height:27px;border-radius:999px;border:1px solid rgba(255,124,50,.35);background:rgba(80,30,12,.65);display:grid;place-items:center}.row{display:flex;align-items:center;gap:13px;padding:14px;margin-bottom:10px}.row .icon{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.025)}.row .body{flex:1;min-width:0}.row strong{display:block}.row small{display:block;color:var(--muted);line-height:1.4;margin-top:3px}.marks{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.mark{appearance:none;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.025);color:var(--muted);padding:7px 10px;font-size:11px}.mark.fire{color:#ffc08a;border-color:rgba(255,126,50,.27);background:rgba(255,126,50,.06)}.detail{padding:18px}.detail h1{font-size:32px}.status{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,176,77,.34);background:rgba(255,145,62,.08);color:var(--gold);border-radius:999px;padding:8px 11px;font-size:12px;margin-bottom:12px}.detail-art{height:150px;display:grid;place-items:center;font-size:68px;background:radial-gradient(circle,rgba(255,151,63,.14),transparent 55%)}.label{color:var(--gold);text-transform:uppercase;letter-spacing:.18em;font-size:11px;margin:18px 4px 10px}.qv-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;align-items:end;padding:16px}.qv{width:min(100%,460px);margin:0 auto calc(env(safe-area-inset-bottom) + 4px);border:1px solid var(--line);border-radius:24px;background:#151518;padding:18px;box-shadow:0 30px 90px rgba(0,0,0,.65)}.qv h3{font:600 24px Georgia,serif;margin:0 0 6px}.qv p{color:var(--muted);line-height:1.45}.qv-actions{display:flex;gap:10px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.control{padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02)}.control label{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}.control input{width:100%;accent-color:var(--amber)}.modes{display:flex;gap:8px;margin-top:12px}.modes button{flex:1;min-height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--muted)}.modes button.active{color:var(--text);border-color:rgba(255,176,77,.4);background:rgba(255,145,62,.08)}.pixel-fire{width:180px;height:220px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(14,1fr);gap:2px;margin:0 auto}.pixel-fire span{border-radius:2px}.note{color:var(--quiet);font-size:11px;text-align:center;line-height:1.5;margin-top:26px}[hidden]{display:none!important}@media(max-width:380px){.hero-copy{max-width:74%}.hero h1{font-size:31px}}
</style>
</head>
<body>
<div id="app" class="app"></div><div id="qv"></div>
<script>
const D={source:{fire:{title:'FIRE',icon:'🔥',short:'Production evidence contributed by Babel FIRE.',detail:'FIRE is a source/origin mark. It answers where credible production evidence came from; it does not mean you are more skilled by itself.'}},domain:{balance:{title:'Balance & Hierarchy',icon:'◫',short:'What leads, what supports, and how elements sit together.'},tone:{title:'Frequency & Tone',icon:'∿',short:'Tonal relationships, masking, clarity, weight, and color.'}},skill:{masking:{title:'Masking Diagnosis',state:'Developing',domain:'tone',short:'Recognize when one sound hides another and identify a useful next experiment.',evidence:[{title:'Even — vocal vs. guitars',text:'Identified frequency competition and tested a targeted tonal change.',source:'fire'},{title:'Creep recreation — low-mid buildup',text:'Compared the reference and isolated a buildup problem before processing.',source:'fire'},{title:'A/B listening practice',text:'Distinguished masking from simple level imbalance.',source:'fire'}]}},achievement:{first:{title:'First Finish',icon:'✦',short:'Finished a complete production journey.',criteria:'Complete a production from starting material through a finished, release-ready audio result.',evidence:'A meaningful completion event, not a tap, streak, or page-completion reward.',source:'fire'},clear:{title:'Clear Space',icon:'◇',short:'Resolved a masking problem through diagnosis and evaluation.',criteria:'Identify masking, make an intentional experiment, and evaluate that clarity improved.',evidence:'Supported by production evidence rather than completion points.',source:'fire'}},lore:{ember:{title:'Quiet Ember',icon:'·',short:'A hidden discovery. Lore can reward curiosity without hiding required workflow.'}}};
const state={route:['world'],tab:'achievement',fire:{mode:'particles',intensity:.58,turbulence:.44,diversity:.62}};let raf=0;
const A=document.querySelector('#app'),Q=document.querySelector('#qv');
function top(back=false,title='World'){return `<div class="top"><button class="round" data-back ${back?'':'hidden'} aria-label="Back">‹</button><div class="brand">${title}</div><button class="round" data-about aria-label="About">•••</button></div>`}
function srcMark(id='fire'){return `<button class="mark fire" data-source="${id}">🔥 FIRE</button>`}
function world(){const t=state.tab;let body='';if(t==='achievement')body=Object.entries(D.achievement).map(([id,x])=>`<button class="tile" data-open="achievement:${id}"><span class="source-dot" data-source="${x.source}">🔥</span><div class="art"><div class="sigil">${x.icon}</div></div><strong>${x.title}</strong><small>${x.short}</small></button>`).join('');if(t==='skill')body=Object.entries(D.skill).map(([id,x])=>`<button class="tile" data-open="skill:${id}"><span class="source-dot" data-source="fire">🔥</span><div class="art"><div class="sigil">∿</div></div><strong>${x.title}</strong><small>${x.state} · ${D.domain[x.domain].title}</small></button>`).join('')+Object.entries(D.domain).map(([id,x])=>`<button class="tile" data-open="domain:${id}"><div class="art"><div class="sigil">${x.icon}</div></div><strong>${x.title}</strong><small>Domain identity</small></button>`).join('');if(t==='lore')body=Object.entries(D.lore).map(([id,x])=>`<button class="tile" data-open="lore:${id}"><div class="art"><div class="sigil">${x.icon}</div></div><strong>${x.title}</strong><small>${x.short}</small></button>`).join('');return `${top()}<section class="hero card"><div class="hero-copy"><div class="eyebrow">Personal progression artifact</div><h1>Your Fire</h1><p>A living reflection of credible production development — expressive on top, truthful evidence underneath.</p></div><div class="fire-wrap"><canvas id="fireHome"></canvas><div class="fire-floor"></div></div><div class="hero-actions"><button class="primary" data-open="fire">Explore Fire</button><button class="secondary" data-cycle>Simulate growth</button></div></section><section class="section"><div class="tabs"><button data-tab="achievement" class="${t==='achievement'?'active':''}">Achievements</button><button data-tab="skill" class="${t==='skill'?'active':''}">Skills / Domains</button><button data-tab="lore" class="${t==='lore'?'active':''}">Lore</button></div><div class="heading"><h2>${t==='achievement'?'Collection':t==='skill'?'Capabilities':'Discoveries'}</h2><small>prototype objects</small></div><div class="grid">${body}</div></section><p class="note">Babel Lab · isolated sandbox · fake data only</p>`}
function achievement(id){const x=D.achievement[id];return `${top(true,'Achievement')}<section class="card detail"><div class="detail-art">${x.icon}</div><div class="eyebrow">Achievement badge</div><h1>${x.title}</h1><p>${x.short}</p><div class="marks">${srcMark(x.source)}</div></section><div class="label">Meaning / criteria</div><div class="card row"><div class="icon">✓</div><div class="body"><strong>What earns it</strong><small>${x.criteria}</small></div></div><div class="card row"><div class="icon">≋</div><div class="body"><strong>Supporting truth</strong><small>${x.evidence}</small></div></div>`}
function skill(id){const x=D.skill[id];return `${top(true,'Skill')}<section class="card detail"><div class="eyebrow">${D.domain[x.domain].title}</div><h1>${x.title}</h1><span class="status">◒ ${x.state}</span><p>${x.short}</p><div class="marks">${srcMark('fire')}</div></section><div class="label">Evidence</div>${x.evidence.map(e=>`<div class="card row"><div class="icon">♪</div><div class="body"><strong>${e.title}</strong><small>${e.text}</small><div class="marks">${srcMark(e.source)}</div></div></div>`).join('')}<div class="label">Related achievement</div><div class="card row" data-open="achievement:clear"><div class="icon">◇</div><div class="body"><strong>Clear Space</strong><small>Resolve masking through diagnosis and evaluation.</small></div></div>`}
function source(id){const x=D.source[id];return `${top(true,'Source Mark')}<section class="card detail"><div class="detail-art">${x.icon}</div><div class="eyebrow">Source / origin mark</div><h1>${x.title}</h1><p>${x.detail}</p></section><div class="label">What this mark means</div><div class="card row"><div class="icon">↗</div><div class="body"><strong>Provenance, not skill</strong><small>This mark can sit compactly beside evidence, skills, or achievements and expand into this deeper identity view when useful.</small></div></div>`}
function domain(id){const x=D.domain[id];return `${top(true,'Domain')}<section class="card detail"><div class="detail-art">${x.icon}</div><div class="eyebrow">Domain identity</div><h1>${x.title}</h1><p>${x.short}</p></section><div class="label">Semantic rule</div><div class="card row"><div class="icon">≠</div><div class="body"><strong>Not an achievement</strong><small>A domain describes an area of capability. Achievements can occur within it, but the domain itself is not something you “win.”</small></div></div>`}
function lore(id){const x=D.lore[id];return `${top(true,'Lore')}<section class="card detail"><div class="detail-art">${x.icon}</div><div class="eyebrow">Hidden discovery</div><h1>${x.title}</h1><p>${x.short}</p></section><div class="label">Guardrail</div><div class="card row"><div class="icon">?</div><div class="body"><strong>Delight, never dependency</strong><small>Lore may reward curiosity but never hides required workflow, accessibility, privacy, recovery, or paid functionality.</small></div></div>`}
function fire(){return `${top(true,'Your Fire')}<section class="card detail"><div class="eyebrow">Living artifact</div><h1>Your Fire</h1><p>One underlying Fire state can support multiple renderers. These controls are temporary visual probes, not a final growth algorithm.</p><div class="detail-art" style="height:280px;position:relative"><canvas id="fireDetail" style="width:100%;height:100%"></canvas><div id="pixel" class="pixel-fire" hidden></div></div><div class="modes"><button data-mode="particles" class="${state.fire.mode==='particles'?'active':''}">Living particles</button><button data-mode="pixel" class="${state.fire.mode==='pixel'?'active':''}">2D pixel</button></div><div class="controls"><div class="control"><label>Intensity</label><input type="range" min="0" max="1" step=".01" value="${state.fire.intensity}" data-range="intensity"></div><div class="control"><label>Turbulence</label><input type="range" min="0" max="1" step=".01" value="${state.fire.turbulence}" data-range="turbulence"></div><div class="control"><label>Shape diversity</label><input type="range" min="0" max="1" step=".01" value="${state.fire.diversity}" data-range="diversity"></div></div></section><div class="label">Important</div><div class="card row"><div class="icon">✓</div><div class="body"><strong>Evidence drives interpretation</strong><small>Opening the app, maintaining a streak, or tapping Complete must never manufacture mastery or grow the Fire by itself.</small></div></div>`}
function view(){cancelAnimationFrame(raf);const [r,id]=state.route;A.innerHTML=r==='world'?world():r==='achievement'?achievement(id):r==='skill'?skill(id):r==='source'?source(id):r==='domain'?domain(id):r==='lore'?lore(id):fire();bind();after()}
function go(s){state.route=s.split(':');window.scrollTo({top:0,behavior:'auto'});view()}function back(){state.route=['world'];view()}
function quickSource(id){const x=D.source[id];Q.innerHTML=`<div class="qv-bg" data-close><div class="qv" role="dialog" aria-modal="true"><div class="eyebrow">Source mark</div><h3>${x.icon} ${x.title}</h3><p>${x.short}</p><div class="qv-actions"><button class="secondary" data-close>Close</button><button class="primary" data-source-detail="${id}">View mark</button></div></div></div>`;Q.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>{if(e.target===b||b.tagName==='BUTTON')Q.innerHTML=''});Q.querySelector('[data-source-detail]').onclick=()=>{Q.innerHTML='';go('source:'+id)}}
function about(){Q.innerHTML=`<div class="qv-bg" data-close><div class="qv"><div class="eyebrow">Babel Lab</div><h3>World Object Grammar</h3><p>Standalone ecosystem sandbox. It does not touch Babel FIRE runtime, storage, schemas, or product code.</p><div class="qv-actions"><button class="primary" data-close>Got it</button></div></div></div>`;Q.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>{if(e.target===b||b.tagName==='BUTTON')Q.innerHTML=''})}
function bind(){document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>go(x.dataset.open));document.querySelectorAll('[data-back]').forEach(x=>x.onclick=back);document.querySelectorAll('[data-about]').forEach(x=>x.onclick=about);document.querySelectorAll('[data-source]').forEach(x=>x.onclick=e=>{e.stopPropagation();quickSource(x.dataset.source)});document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{state.tab=x.dataset.tab;view()});document.querySelectorAll('[data-cycle]').forEach(x=>x.onclick=()=>{state.fire.intensity=Math.min(.95,state.fire.intensity+.1);state.fire.turbulence=Math.min(.9,state.fire.turbulence+.07);view()});document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{state.fire.mode=x.dataset.mode;view()});document.querySelectorAll('[data-range]').forEach(x=>x.oninput=()=>{state.fire[x.dataset.range]=+x.value;if(state.fire.mode==='pixel')drawPixel()})}
function after(){const home=document.querySelector('#fireHome');if(home)startFire(home,true);const det=document.querySelector('#fireDetail'),pix=document.querySelector('#pixel');if(det){det.hidden=state.fire.mode!=='particles';pix.hidden=state.fire.mode!=='pixel';if(state.fire.mode==='particles')startFire(det,false);else drawPixel()}}
function startFire(canvas,compact){const reduced=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches),ctx=canvas.getContext('2d');let parts=[],last=performance.now(),rect;function resize(){rect=canvas.getBoundingClientRect();const d=Math.min(devicePixelRatio||1,2);canvas.width=rect.width*d;canvas.height=rect.height*d;ctx.setTransform(d,0,0,d,0,0)}resize();if('ResizeObserver'in window)new ResizeObserver(resize).observe(canvas);else addEventListener('resize',resize,{passive:true});function spawn(n){const by=rect.height*(compact?.78:.84),bx=rect.width*.5;for(let i=0;i<n;i++)parts.push({x:bx+(Math.random()-.5)*(compact?34:52),y:by+Math.random()*8,vx:(Math.random()-.5)*(14+22*state.fire.turbulence),vy:-(28+Math.random()*46)*(.75+state.fire.intensity),age:0,life:.7+Math.random()*1.25,size:2+Math.random()*(4+5*state.fire.diversity),spin:(Math.random()-.5)*2,rot:Math.random()*Math.PI,shape:Math.random(),hot:Math.random()})}spawn(compact?70:110);parts.forEach(p=>{p.age=Math.random()*p.life*.82;const q=p.age/p.life;p.y-=q*(compact?145:190)*(.65+Math.random()*.55);p.x+=(Math.random()-.5)*q*(compact?46:64)});function frame(t){const dt=Math.min((t-last)/1000,.033);last=t;ctx.clearRect(0,0,rect.width,rect.height);if(reduced){for(let i=0;i<16;i++){const q=i/16,x=rect.width/2+Math.sin(i*1.7)*24,y=rect.height*.8-q*145;ctx.fillStyle=`rgba(255,${130+q*90},${45+q*70},${.35+.5*(1-q)})`;ctx.fillRect(x-4,y-4,8,8)}return}const cx=rect.width*.5,cy=rect.height*(compact?.75:.80),g=ctx.createRadialGradient(cx,cy,4,cx,cy,compact?62:82);g.addColorStop(0,'rgba(255,224,150,.34)');g.addColorStop(.28,'rgba(255,139,53,.20)');g.addColorStop(1,'rgba(255,88,28,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,cy-(compact?34:48),compact?34:45,compact?72:96,0,0,Math.PI*2);ctx.fill();spawn(Math.max(1,Math.floor(3+7*state.fire.intensity)));parts=parts.filter(p=>p.age<p.life);for(const p of parts){p.age+=dt;const q=p.age/p.life;p.vx+=Math.sin((p.y+p.age*70)*.04)*18*state.fire.turbulence*dt;p.vy-=5*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.spin*dt;const a=Math.max(0,1-q),s=p.size*(1-.38*q),gl=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,s*2.6);gl.addColorStop(0,`rgba(255,232,164,${a*.95})`);gl.addColorStop(.35,`rgba(255,152,61,${a*.75})`);gl.addColorStop(1,'rgba(255,80,20,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(p.x,p.y,s*2.6,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.hot>.66?`rgba(255,237,170,${a})`:`rgba(255,132,51,${a})`;if(p.shape<.34+state.fire.diversity*.18)ctx.fillRect(-s/2,-s/2,s,s);else if(p.shape<.72){ctx.rotate(Math.PI/4);ctx.fillRect(-s/2,-s/2,s,s)}else{ctx.beginPath();ctx.arc(0,0,s*.52,0,Math.PI*2);ctx.fill()}ctx.restore()}raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
function drawPixel(){const root=document.querySelector('#pixel');if(!root)return;let h='';for(let y=0;y<14;y++)for(let x=0;x<12;x++){const nx=(x-5.5)/6,ny=1-y/13,w=.18+.78*(1-ny)*(.65+state.fire.intensity*.35),wave=Math.sin(y*1.8+x*.7)*.08*state.fire.turbulence,inside=Math.abs(nx+wave)<w&&ny<.95,flick=Math.random()<(inside?.78:.045*state.fire.diversity);let c='transparent';if(inside&&flick){const heat=Math.max(0,1-Math.abs(nx)/(w||1));c=heat>.72?'#ffe5a3':heat>.35?'#ff9a3c':'#e75322'}else if(!inside&&flick)c='#ff8b32';h+=`<span style="background:${c};box-shadow:${c!=='transparent'?'0 0 8px '+c:'none'}"></span>`}root.innerHTML=h}
view();
</script>
</body>
</html>
