<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#09090a" />
  <title>Babel Lab — Fire + Achievements</title>
  <link rel="stylesheet" href="app.css?v=3" />
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite"></div>
  <div id="quickview-root"></div>
  <script>
    (function(){
      function showBootError(message){
        var app=document.getElementById('app');
        if(!app)return;
        app.innerHTML='<div class="error-card"><strong>Babel Lab hit a JavaScript error.</strong><br><br>'+String(message)+'</div>';
      }
      window.addEventListener('error',function(e){showBootError(e.message||'Unknown script error');});
      window.addEventListener('unhandledrejection',function(e){showBootError(e.reason||'Unhandled promise error');});
    })();
  </script>
  <script src="app-core.js?v=3"></script>
  <script src="fire.js?v=3"></script>
</body>
</html>
