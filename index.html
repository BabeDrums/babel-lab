<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090a0d" />
  <title>Babel Lab</title>
  <link rel="stylesheet" href="shared/lab.css?v=10" />
</head>
<body>
  <main class="lab-shell launcher-shell">
    <header class="lab-header">
      <h1>Babel Lab</h1>
      <p>Try ideas here. Keep what earns its way forward.</p>
    </header>

    <section class="launcher-section" aria-label="Lab destinations">
      <div class="launcher-cards">
        <a class="launcher-card" href="fire/">
          <span class="launcher-card-mark" aria-hidden="true">🔥</span>
          <span class="launcher-card-copy">
            <strong>Fire Lab</strong>
            <small>Fire visualization and progression.</small>
          </span>
          <span class="launcher-card-chevron" aria-hidden="true">›</span>
        </a>

        <a class="launcher-card" href="world/">
          <span class="launcher-card-mark" aria-hidden="true">✦</span>
          <span class="launcher-card-copy">
            <strong>World Lab</strong>
            <small>WORLD experiments and product proofs.</small>
          </span>
          <span class="launcher-card-chevron" aria-hidden="true">›</span>
        </a>
      </div>
    </section>

    <p class="lab-version" aria-label="Babel Lab version">LAB · 0.6</p>
  </main>
</body>
</html>
