<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090a0d" />
  <title>Babel Lab</title>
  <link rel="stylesheet" href="shared/lab.css?v=9" />
</head>
<body>
  <main class="lab-shell launcher-shell">
    <header class="lab-header">
      <h1>Babel Lab</h1>
      <p>Try ideas here. Keep what earns its way forward.</p>
    </header>

    <section class="launcher-section" aria-labelledby="experiments-title">
      <h2 id="experiments-title" class="section-kicker">Experiments</h2>
      <div class="experiment-list">
        <a class="experiment-row" href="fire/">
          <span class="experiment-mark" aria-hidden="true">🔥</span>
          <span class="experiment-copy"><strong>Fire Lab</strong><small>Fire visualization and progression.</small></span>
          <span class="row-chevron" aria-hidden="true">›</span>
        </a>
        <a class="experiment-row" href="world/">
          <span class="experiment-mark" aria-hidden="true">✦</span>
          <span class="experiment-copy"><strong>World Lab</strong><small>Collection and discovery ideas.</small></span>
          <span class="row-chevron" aria-hidden="true">›</span>
        </a>
        <a class="experiment-row" href="world/context-loop/">
          <span class="experiment-mark" aria-hidden="true">◎</span>
          <span class="experiment-copy"><strong>WORLD Phase 1</strong><small>Orientation and next-step logic.</small></span>
          <span class="row-chevron" aria-hidden="true">›</span>
        </a>
      </div>
    </section>

    <p class="lab-version" aria-label="Babel Lab version">LAB · 0.4</p>
  </main>
</body>
</html>
