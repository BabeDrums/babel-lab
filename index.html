<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090a0d" />
  <title>Babel Lab</title>
  <link rel="stylesheet" href="shared/lab.css?v=12" />
  <link rel="stylesheet" href="shared/card-candidates.css?v=1" />
  <link rel="stylesheet" href="shared/home.css?v=2" />
  <link rel="stylesheet" href="shared/header-reference.css?v=4" />
</head>
<body>
  <main class="lab-shell launcher-shell">
    <header class="lab-header">
      <h1>Babel Lab</h1>
      <p>Try ideas here. Keep what earns its way forward.</p>
    </header>

    <section class="launcher-section" aria-label="Lab destinations">
      <div class="launcher-cards">
        <a class="large-card large-card--destination" href="shell/">
          <span class="large-card__title">Shell Gallery</span>
          <span class="large-card__meta">Shared Babel UI proving ground.</span>
          <span class="large-card__chevron" aria-hidden="true">›</span>
        </a>

        <a class="large-card large-card--destination" href="fire/">
          <span class="large-card__title">Fire Lab</span>
          <span class="large-card__meta">FIRE-specific experiments and product auditions.</span>
          <span class="large-card__chevron" aria-hidden="true">›</span>
        </a>

        <a class="large-card large-card--destination" href="world/">
          <span class="large-card__title">World Lab</span>
          <span class="large-card__meta">WORLD experiments and product proofs.</span>
          <span class="large-card__chevron" aria-hidden="true">›</span>
        </a>
      </div>
    </section>

    <p class="lab-version" aria-label="Babel Lab version">LAB · 0.8</p>
  </main>
</body>
</html>
