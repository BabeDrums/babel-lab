<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090a0d" />
  <title>Babel Lab — WORLD Phase 1</title>
  <link rel="stylesheet" href="../../shared/lab.css?v=11" />
  <link rel="stylesheet" href="context-loop.css?v=5" />
  <link rel="stylesheet" href="shell-reference.css?v=3" />
  <link rel="stylesheet" href="../../shared/header-reference.css?v=4" />
  <style>.world-doorway-stars{position:absolute;inset:0;pointer-events:none}</style>
</head>
<body>
  <div id="app" class="lab-shell context-shell" aria-live="polite"></div>
  <div id="quickview-root"></div>
  <script>
    (function(){
      function showBootError(message){
        var app=document.getElementById('app');
        if(!app)return;
        app.innerHTML='<div class="error-card"><strong>WORLD Phase 1 hit a JavaScript error.</strong><br><br>'+String(message)+'</div>';
      }
      window.addEventListener('error',function(e){showBootError(e.message||'Unknown script error');});
      window.addEventListener('unhandledrejection',function(e){showBootError(e.reason||'Unhandled promise error');});
    })();
  </script>
  <script src="context-loop.js?v=4"></script>
  <script>
    (function(){
      var app=document.getElementById('app');
      function syncWorldBack(){
        var back=document.querySelector('.context-topbar .back-link');
        if(!back)return;
        back.setAttribute('href','../');
        back.setAttribute('aria-label','Back to World Lab');
      }
      new MutationObserver(syncWorldBack).observe(app,{childList:true,subtree:true});
      syncWorldBack();
    })();
  </script>
</body>
</html>
