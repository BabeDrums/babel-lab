<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>FIRE Shell Lab</title><style>
:root{color-scheme:dark;--bg:#09090b;--surface:#141416;--control:#121215;--selected:#252529;--text:#f5f5f7;--muted:#9a9aa1;--quiet:#6f7078;--line:rgba(255,255,255,.09);--strong:rgba(255,255,255,.16);--danger:#ff8f9a;--r:16px;--touch:44px;--row:64px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}body{min-height:100dvh;overscroll-behavior-y:none}button,input,select{font:inherit;color:inherit}button{appearance:none;border:0;background:none;cursor:pointer}.app{width:min(100%,760px);margin:auto;min-height:100dvh;padding:calc(10px + env(safe-area-inset-top)) 20px calc(26px + env(safe-area-inset-bottom))}.screen{padding-bottom:72px}.header{margin-bottom:20px}.toolbar{min-height:44px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.tool,.spacer{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}.tool:active{background:rgba(255,255,255,.065)}.tool.box{border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035)}.back{font-size:29px;color:var(--muted)}.more{font-size:17px;color:#b8b8c0;letter-spacing:1px}.add{font-size:25px}h1{margin:0;font-size:34px;line-height:1.04;font-weight:780;letter-spacing:-.04em}.meta{margin:7px 0 0;color:var(--muted);font-size:15px}.group,.formgroup{overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}.row,.project,.arrange{min-height:var(--row);border-bottom:1px solid var(--line)}.row:last-child,.project:last-child,.arrange:last-child{border-bottom:0}.row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 16px;text-align:left}.row:active,.project-open:active,.edit-section:active{background:rgba(255,255,255,.045)}.title{font-size:16px;font-weight:600}.sub{display:block;margin-top:2px;font-size:12px;color:var(--muted)}.mark{width:20px;text-align:center;color:#d9d9de}.ring{width:23px;height:23px;border-radius:50%;border:1.5px solid #55565f;display:inline-block}.check{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#e5e5ea;color:#111114;font-size:13px;font-weight:800}.project{display:grid;grid-template-columns:minmax(0,1fr) 52px;align-items:center}.project-open{min-height:var(--row);padding:8px 12px 8px 16px;text-align:left}.project-open strong{display:block;font-size:17px}.project-open span{display:block;margin-top:2px;color:var(--muted);font-size:13px}.project-more{width:44px;height:44px;justify-self:center;border-radius:12px}.project-more:active{background:rgba(255,255,255,.075)}.formrow{min-height:var(--row);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;padding:8px 16px;border-bottom:1px solid var(--line)}.formrow:last-child{border-bottom:0}.formlabel{font-size:16px;font-weight:600}.value{min-height:38px;min-width:72px;padding:0 10px;display:flex;align-items:center;justify-content:flex-end;gap:8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035)}.value:focus-within{border-color:rgba(255,255,255,.22)}.value input{width:44px;border:0;outline:0;background:transparent;text-align:right;font-size:16px}.value small{color:var(--muted)}select{min-height:34px;border:0;outline:0;background:transparent}.work{min-height:calc(100dvh - 36px - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:flex;flex-direction:column;padding-bottom:24px}.work-action{margin-top:auto;padding-top:20px;display:flex;justify-content:flex-end}.primary{min-height:46px;min-width:126px;padding:0 17px;border-radius:12px;background:#3a3a40;border:1px solid #5a5a63;font-weight:700}.stack{display:grid;gap:12px}.arrange{display:grid;grid-template-columns:minmax(0,1fr) 52px;align-items:center}.edit-section{min-height:var(--row);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 4px 8px 16px;text-align:left}.bars{color:var(--muted);font-size:13px}.reorder{width:44px;height:44px;justify-self:center;color:var(--quiet);font-size:22px;touch-action:none}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;overflow:hidden;border:1px solid var(--line);background:var(--line);border-radius:var(--r)}.choice{min-height:52px;background:var(--control);padding:0 16px;text-align:left;font-weight:610}.choice.on{background:var(--selected)}.empty{min-height:64px;display:grid;place-items:center;color:var(--muted)}.sheetback{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:24px}.sheet{width:min(560px,calc(100vw - 48px));max-height:84dvh;overflow:auto;background:#1b1b1e;border:1px solid var(--strong);border-radius:24px;padding:20px;box-shadow:0 24px 80px rgba(0,0,0,.55)}.sheet h2{margin:0 0 18px;font-size:24px}.fieldlabel{display:block;color:#b7b7bf;font-size:13px;font-weight:650;margin:14px 2px 7px}.field{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:#121215;padding:0 14px;outline:0}.seg,.typegrid{display:grid;gap:1px;overflow:hidden;border:1px solid var(--line);background:var(--line);border-radius:12px}.typegrid{grid-template-columns:1fr 1fr}.seg{grid-template-columns:repeat(5,1fr)}.pick{min-height:48px;background:#121215;padding:0 12px;text-align:left}.seg .pick{text-align:center}.pick.on{background:var(--selected)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.actions button{min-height:48px;border-radius:12px;font-weight:700}.cancel{background:#252529}.confirm{background:#ededf0;color:#111}.danger{color:var(--danger)}.menu{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}.menu button{min-height:50px;background:#151518;text-align:left;padding:0 16px}.labdev{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:4}.labdev summary{list-style:none;width:30px;height:30px;border-radius:15px;border:1px solid rgba(255,255,255,.08);background:#111114;color:#777;display:grid;place-items:center;font-size:11px}.labdev[open]{background:#111114;border:1px solid var(--line);border-radius:14px;padding:8px}.labdev[open] summary{margin-left:auto}.labdev button{display:block;color:var(--muted);padding:8px;font-size:12px}@media(max-width:700px){.sheetback{align-items:end;padding:0}.sheet{width:100%;max-height:89dvh;border-radius:26px 26px 0 0;border-left:0;border-right:0;border-bottom:0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}}
</style></head><body><div id="app" class="app"></div><div id="modal"></div><details class="labdev"><summary>LAB</summary><button id="reset">Reset fixture</button></details><script>
const KEY='babel-lab-fire-shell-parity-v1';const common=['Vocal','Drums','Bass','Ukulele','Guitar','Piano','Synth','Backing vocals','Percussion','FX'];const types=['Intro','Verse','Pre-Chorus','Chorus','Bridge','Instrumental','Outro'];const uid=()=>crypto.randomUUID?.()||Date.now()+Math.random().toString(36);const fresh=()=>({current:null,projects:[{id:'smith',type:'study',title:'Smithereens',artist:'Joji',setup:{reference:true,tempo:'101',meter:'4/4',grid:true,listen:true},sections:[{id:'i',name:'Intro',bars:8},{id:'v',name:'Verse',bars:8},{id:'c',name:'Chorus',bars:8}],verified:false,tracks:['Vocal','Drums']},{id:'still',type:'original',title:'Still',artist:'',setup:null,sections:[],verified:false,tracks:[]}]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}let route='projects',historyStack=[];const app=document.getElementById('app'),modal=document.getElementById('modal');const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const project=()=>db.projects.find(p=>p.id===db.current);const meta=p=>p.type==='study'?(p.artist?`${p.artist} · Cover`:'Cover'):(p.artist?`${p.artist} · Original`:'Original');
function header(title,{back=false,right='',metaText=''}={}){return `<header class="header"><div class="toolbar">${back?'<button class="tool back" data-back>‹</button>':'<span class="spacer"></span>'}${right?`<button class="tool box ${right==='more'?'more':'add'}" data-action="${right}">${right==='more'?'•••':'+'}</button>`:'<span class="spacer"></span>'}</div><h1>${title}</h1>${metaText?`<p class="meta">${metaText}</p>`:''}</header>`}
function nav(to){historyStack.push(route);route=to;render();scrollTo(0,0)}function back(){route=historyStack.pop()||(route==='project'?'projects':'project');render();scrollTo(0,0)}function completeSetup(p){return p.setup?.reference&&Number(p.setup.tempo)>0&&p.setup.grid&&p.setup.listen}function completeStructure(p){return p.sections.length&&p.verified}function render(){const p=project();if(route!=='projects'&&!p){route='projects'}if(route==='projects'){app.innerHTML=`<main class="screen">${header('Projects',{right:'new'})}<div class="group">${db.projects.map(p=>`<div class="project"><button class="project-open" data-open="${p.id}"><strong>${p.title}</strong><span>${meta(p)}</span></button><button class="project-more more" data-project-menu="${p.id}">•••</button></div>`).join('')||'<div class="empty">No projects yet.</div>'}</div></main>`;return}if(route==='project'){if(p.type!=='study'){app.innerHTML=`<main class="screen">${header(p.title,{back:true,right:'more',metaText:meta(p)})}<div class="empty">Original workflow isn't built yet.</div></main>`;return}const next=!completeSetup(p)?'setup':!completeStructure(p)?'structure':!p.tracks.length?'tracks':null;app.innerHTML=`<main class="screen">${header(p.title,{back:true,right:'more',metaText:meta(p)})}<div class="group">${[['setup','Setup'],['structure','Structure'],['tracks','Tracks']].map(([r,n])=>{const done=r==='setup'?completeSetup(p):r==='structure'?completeStructure(p):p.tracks.length>0;return `<button class="row" data-route="${r}"><span class="title">${n}</span><span class="mark">${done?'✓':next===r?'→':'○'}</span></button>`}).join('')}</div></main>`;return}if(route==='setup'){app.innerHTML=`<main class="screen work">${header('Setup',{back:true})}<div class="formgroup"><button class="formrow" data-toggle="reference"><span class="formlabel">Reference</span>${p.setup.reference?'<span class="check">✓</span>':'<span class="ring"></span>'}</button><div class="formrow"><span class="formlabel">Tempo</span><span class="value"><input id="tempo" inputmode="decimal" value="${p.setup.tempo}"><small>BPM</small></span></div><div class="formrow"><span class="formlabel">Meter</span><span class="value"><select id="meter"><option>4/4</option><option>3/4</option><option>6/8</option></select></span></div><button class="formrow" data-toggle="grid"><span class="formlabel">Grid</span>${p.setup.grid?'<span class="check">✓</span>':'<span class="ring"></span>'}</button><button class="formrow" data-toggle="listen"><span class="formlabel">Listen</span>${p.setup.listen?'<span class="check">✓</span>':'<span class="ring"></span>'}</button></div>${completeSetup(p)?'<div class="work-action"><button class="primary" data-route="structure">Continue</button></div>':''}</main>`;document.getElementById('meter').value=p.setup.meter;return}if(route==='structure'){app.innerHTML=`<main class="screen work">${header('Structure',{back:true,right:'section'})}<div class="stack">${p.sections.length?`<div class="group">${p.sections.map((s,i)=>`<div class="arrange"><button class="edit-section" data-edit-section="${s.id}"><span class="title">${s.name}</span><span class="bars">${s.bars} bars</span></button><button class="reorder" data-move="${s.id}" title="Move down">≡</button></div>`).join('')}</div><div class="group"><button class="row" data-verify><span class="title">Accurate</span>${p.verified?'<span class="check">✓</span>':'<span class="ring"></span>'}</button></div>`:''}</div>${completeStructure(p)?'<div class="work-action"><button class="primary" data-route="tracks">Continue</button></div>':''}</main>`;return}if(route==='tracks'){const extras=p.tracks.filter(x=>!common.includes(x));const names=[...common,...extras];app.innerHTML=`<main class="screen work">${header('Tracks',{back:true,right:'track'})}<div class="choices">${names.map(n=>`<button class="choice ${p.tracks.includes(n)?'on':''}" data-track="${n}">${n}</button>`).join('')}</div>${p.tracks.length?'<div class="work-action"><button class="primary" data-done>Done</button></div>':''}</main>`}}
function close(){modal.innerHTML=''}function sheet(body){modal.innerHTML=`<div class="sheetback" data-dismiss><section class="sheet" onclick="event.stopPropagation()">${body}</section></div>`}function projectSheet(existing=null){sheet(`<h2>${existing?'Edit Project':'New Project'}</h2><label class="fieldlabel">Type</label><div class="seg"><button class="pick ${!existing||existing.type==='study'?'on':''}" data-ptype="study">Cover</button><button class="pick ${existing?.type==='original'?'on':''}" data-ptype="original">Original</button><span></span><span></span><span></span></div><label class="fieldlabel">Title</label><input class="field" id="ptitle" value="${existing?.title||''}"><label class="fieldlabel">Artist</label><input class="field" id="partist" value="${existing?.artist||''}"><div class="actions"><button class="cancel" data-close>Cancel</button><button class="confirm" data-save-project="${existing?.id||''}">${existing?'Save':'Create'}</button></div></section>`)}function projectMenu(id){const p=db.projects.find(x=>x.id===id);sheet(`<h2>${p.title}</h2><div class="menu"><button data-edit-project="${id}">Edit Project</button>${p.type==='study'?`<button data-reset-project="${id}">Reset Map</button>`:''}<button class="danger" data-delete-project="${id}">Delete Project</button></div><div class="actions"><button class="cancel" data-close>Cancel</button><span></span></div>`)}function sectionSheet(s=null){sheet(`<h2>${s?'Edit Section':'Add Section'}</h2><label class="fieldlabel">Section</label><div class="typegrid">${types.map((n,i)=>`<button class="pick ${s?.name===n||(!s&&i===0)?'on':''}" data-stype="${n}">${n}</button>`).join('')}<button class="pick" data-stype="custom">+</button></div><input class="field" id="customSection" placeholder="Custom section" style="display:none;margin-top:8px"><label class="fieldlabel">Length</label><div class="seg">${[4,8,12,16].map(n=>`<button class="pick ${(s?.bars||8)===n?'on':''}" data-bars="${n}">${n}</button>`).join('')}<button class="pick" data-bars="custom">+</button></div><input class="field" id="customBars" inputmode="numeric" placeholder="Bars" style="display:none;margin-top:8px">${s?`<button class="danger" style="margin-top:18px" data-delete-section="${s.id}">Delete Section</button>`:''}<div class="actions"><button class="cancel" data-close>Cancel</button><button class="confirm" data-save-section="${s?.id||''}">${s?'Save':'Add'}</button></div>`)}function trackSheet(){sheet(`<h2>Add Track</h2><label class="fieldlabel">Track</label><input class="field" id="trackName" placeholder="Track name" autofocus><div class="actions"><button class="cancel" data-close>Cancel</button><button class="confirm" data-add-track>Add</button></div>`)}
document.addEventListener('click',e=>{if(e.target.closest('[data-back]'))return back();const open=e.target.closest('[data-open]');if(open){db.current=open.dataset.open;save();return nav('project')}const r=e.target.closest('[data-route]');if(r)return nav(r.dataset.route);const a=e.target.closest('[data-action]');if(a){if(a.dataset.action==='new')return projectSheet();if(a.dataset.action==='more')return projectMenu(db.current);if(a.dataset.action==='section')return sectionSheet();if(a.dataset.action==='track')return trackSheet()}const pm=e.target.closest('[data-project-menu]');if(pm)return projectMenu(pm.dataset.projectMenu);const ep=e.target.closest('[data-edit-project]');if(ep)return projectSheet(db.projects.find(x=>x.id===ep.dataset.editProject));const rp=e.target.closest('[data-reset-project]');if(rp){const p=db.projects.find(x=>x.id===rp.dataset.resetProject);p.setup={reference:false,tempo:'',meter:'4/4',grid:false,listen:false};p.sections=[];p.verified=false;p.tracks=[];save();close();return render()}const dp=e.target.closest('[data-delete-project]');if(dp){db.projects=db.projects.filter(x=>x.id!==dp.dataset.deleteProject);if(db.current===dp.dataset.deleteProject)db.current=null;save();close();route='projects';return render()}const t=e.target.closest('[data-toggle]');if(t){project().setup[t.dataset.toggle]=!project().setup[t.dataset.toggle];save();return render()}const tr=e.target.closest('[data-track]');if(tr){const p=project(),n=tr.dataset.track;p.tracks=p.tracks.includes(n)?p.tracks.filter(x=>x!==n):[...p.tracks,n];save();return render()}if(e.target.closest('[data-done]'))return nav('project');if(e.target.closest('[data-verify]')){project().verified=!project().verified;save();return render()}const es=e.target.closest('[data-edit-section]');if(es)return sectionSheet(project().sections.find(x=>x.id===es.dataset.editSection));const mv=e.target.closest('[data-move]');if(mv){const p=project(),i=p.sections.findIndex(x=>x.id===mv.dataset.move);if(i>=0&&p.sections.length>1){const [x]=p.sections.splice(i,1);p.sections.splice((i+1)%p.sections.length,0,x);save();render()}return}if(e.target.closest('[data-close]')||e.target.closest('[data-dismiss]'))return close();const pt=e.target.closest('[data-ptype]');if(pt){document.querySelectorAll('[data-ptype]').forEach(x=>x.classList.toggle('on',x===pt));return}const sp=e.target.closest('[data-stype]');if(sp){document.querySelectorAll('[data-stype]').forEach(x=>x.classList.toggle('on',x===sp));document.getElementById('customSection').style.display=sp.dataset.stype==='custom'?'block':'none';return}const bp=e.target.closest('[data-bars]');if(bp){document.querySelectorAll('[data-bars]').forEach(x=>x.classList.toggle('on',x===bp));document.getElementById('customBars').style.display=bp.dataset.bars==='custom'?'block':'none';return}const saveP=e.target.closest('[data-save-project]');if(saveP){const id=saveP.dataset.saveProject,title=document.getElementById('ptitle').value.trim()||'Untitled',artist=document.getElementById('partist').value.trim(),type=document.querySelector('[data-ptype].on')?.dataset.ptype||'study';if(id){const p=db.projects.find(x=>x.id===id);p.title=title;p.artist=artist}else{const p={id:uid(),type,title,artist,setup:type==='study'?{reference:false,tempo:'',meter:'4/4',grid:false,listen:false}:null,sections:[],verified:false,tracks:[]};db.projects.unshift(p)}save();close();return render()}const saveS=e.target.closest('[data-save-section]');if(saveS){const sel=document.querySelector('[data-stype].on'),bsel=document.querySelector('[data-bars].on'),name=sel?.dataset.stype==='custom'?(document.getElementById('customSection').value.trim()||'Section'):(sel?.dataset.stype||'Intro'),bars=bsel?.dataset.bars==='custom'?(Number(document.getElementById('customBars').value)||8):Number(bsel?.dataset.bars||8),p=project();if(saveS.dataset.saveSection){const s=p.sections.find(x=>x.id===saveS.dataset.saveSection);s.name=name;s.bars=bars}else p.sections.push({id:uid(),name,bars});save();close();return render()}const ds=e.target.closest('[data-delete-section]');if(ds){project().sections=project().sections.filter(x=>x.id!==ds.dataset.deleteSection);save();close();return render()}if(e.target.closest('[data-add-track]')){const n=document.getElementById('trackName').value.trim();if(n&&!project().tracks.includes(n))project().tracks.push(n);save();close();return render()}});document.addEventListener('input',e=>{if(e.target.id==='tempo'){project().setup.tempo=e.target.value;save()}});document.addEventListener('change',e=>{if(e.target.id==='meter'){project().setup.meter=e.target.value;save()}});document.getElementById('reset').onclick=()=>{db=fresh();save();route='projects';historyStack=[];render()};render();
</script></body></html>
