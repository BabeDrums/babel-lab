<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>Babel Lab — Visual Lab</title>
<style>
:root{color-scheme:dark;--bg:#08080a;--sheet:#1a1a1e;--cell:#141417;--selected:#29292f;--line:rgba(255,255,255,.09);--text:#f5f5f7;--muted:#9a9aa3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}button,input{font:inherit;color:inherit}.page{min-height:100dvh;max-width:1024px;margin:auto;padding:max(24px,env(safe-area-inset-top)) 48px max(32px,env(safe-area-inset-bottom))}.labnote{display:flex;align-items:center;gap:12px;height:44px;color:var(--muted);font-size:13px}.labnote a{width:36px;height:36px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;color:#eee;text-decoration:none;font-size:22px}.toolbar{height:50px;display:flex;align-items:center;justify-content:space-between;margin:10px 0}.icon{width:44px;height:44px;border:0;background:transparent;color:#aaaab2;display:grid;place-items:center;border-radius:12px;font-size:28px}.icon.trailing{border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);color:#eee;font-size:24px}h1{font-size:54px;letter-spacing:-.045em;line-height:1;margin:0 0 30px;font-weight:760}.rows{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#121215}.row{height:76px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row strong{font-size:18px}.row span{font-size:15px;color:var(--muted)}.dim{position:fixed;inset:0;background:rgba(0,0,0,.66)}.wrap{position:fixed;inset:0;display:grid;place-items:center;padding:24px}.modal{width:min(620px,calc(100vw - 80px));max-height:min(82dvh,760px);overflow:auto;background:var(--sheet);border:1px solid rgba(255,255,255,.16);border-radius:26px;box-shadow:0 28px 80px rgba(0,0,0,.52);padding:24px}.group+.group{margin-top:22px}.label{margin:0 2px 10px;font-size:15px;line-height:1;font-weight:680;color:#b8b8c0}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--cell)}.choice{min-height:56px;padding:0 18px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;color:#ececf0;text-align:left;font-weight:620;font-size:16px}.choice:nth-child(2n){border-right:0}.choice:nth-last-child(-n+2){border-bottom:0}.choice.selected{background:var(--selected);color:#fff}.choice.plus{text-align:center;padding:0;font-size:24px;font-weight:400;color:#c9c9cf}.segments{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--cell)}.segment{min-height:48px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);font-weight:650;font-size:15px}.segment:last-child{border-right:0}.segment.selected{background:var(--selected);color:#fff}.segment.plus{font-size:23px;font-weight:400;color:#c9c9cf}.reveal{display:grid;grid-template-rows:0fr;margin-top:0;transition:grid-template-rows .18s ease,margin-top .18s ease}.reveal.show{grid-template-rows:1fr;margin-top:10px}.reveal>div{overflow:hidden}.field{width:100%;height:50px;border:1px solid var(--line);border-radius:13px;background:#101013;color:var(--text);outline:none;padding:0 15px;font-size:16px}.field::placeholder{color:#777780}.field:focus{border-color:rgba(255,255,255,.24);background:#141417}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.action{min-height:50px;border-radius:14px;font-size:16px;font-weight:720}.secondary{border:1px solid var(--line);background:#202024;color:#e5e5e9}.primary{border:1px solid rgba(255,255,255,.18);background:#f0f0f2;color:#151518}.primary:disabled{background:#25252a;color:#696a73;border-color:rgba(255,255,255,.06)}.toast{display:none;margin-top:12px;text-align:center;color:#b8b8c0;font-size:13px}.toast.show{display:block}
@media(max-width:700px){.page{padding-inline:18px}h1{font-size:40px}.wrap{align-items:end;padding:0}.modal{width:100%;max-height:88dvh;border-radius:28px 28px 0 0;border-left:0;border-right:0;border-bottom:0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<main class="page"><div class="labnote"><a href="../" aria-label="Back to Babel Lab">‹</a><span>Visual Lab · Structure modal candidate 01 · experimental</span></div><div class="toolbar"><button class="icon">‹</button><button class="icon trailing">+</button></div><h1>Structure</h1><div class="rows"><div class="row"><strong>Intro</strong><span>8 bars &nbsp; ≡</span></div><div class="row"><strong>Verse</strong><span>8 bars &nbsp; ≡</span></div></div><div style="height:18px"></div><div class="rows"><div class="row"><strong>Accurate</strong><span>✓</span></div></div></main>
<div class="dim"></div><div class="wrap"><section class="modal" role="dialog" aria-modal="true" aria-label="Add section">
<section class="group"><div class="label">Section</div><div class="choice-grid" id="sectionGrid"><button class="choice selected">Intro</button><button class="choice">Verse</button><button class="choice">Pre-Chorus</button><button class="choice">Chorus</button><button class="choice">Bridge</button><button class="choice">Instrumental</button><button class="choice">Outro</button><button class="choice plus" id="customSectionButton" type="button" aria-label="Custom section">+</button></div><div class="reveal" id="sectionReveal"><div><input class="field" id="sectionField" placeholder="Section" autocomplete="off"></div></div></section>
<section class="group"><div class="label">Length</div><div class="segments" id="barSegments"><button class="segment">4</button><button class="segment selected">8</button><button class="segment">12</button><button class="segment">16</button><button class="segment plus" id="customBarsButton" type="button" aria-label="Custom length">+</button></div><div class="reveal" id="barsReveal"><div><input class="field" id="barsField" inputmode="numeric" pattern="[0-9]*" placeholder="Bars"></div></div></section>
<div class="actions"><button class="action secondary" id="cancelButton">Cancel</button><button class="action primary" id="addButton">Add</button></div><div class="toast" id="toast"></div></section></div>
<script>
const sectionButtons=[...document.querySelectorAll('#sectionGrid .choice:not(.plus)')],barButtons=[...document.querySelectorAll('#barSegments .segment:not(.plus)')],customSectionButton=document.getElementById('customSectionButton'),customBarsButton=document.getElementById('customBarsButton'),sectionReveal=document.getElementById('sectionReveal'),barsReveal=document.getElementById('barsReveal'),sectionField=document.getElementById('sectionField'),barsField=document.getElementById('barsField'),addButton=document.getElementById('addButton'),toast=document.getElementById('toast');let section='Intro',bars='8';function sync(){sectionReveal.classList.toggle('show',section==='custom');barsReveal.classList.toggle('show',bars==='custom');const sectionReady=section!=='custom'||sectionField.value.trim().length>0;const barsReady=bars!=='custom'||(/^\d+$/.test(barsField.value)&&Number(barsField.value)>0);addButton.disabled=!(sectionReady&&barsReady)}function clearSection(){[...sectionButtons,customSectionButton].forEach(b=>b.classList.remove('selected'))}function clearBars(){[...barButtons,customBarsButton].forEach(b=>b.classList.remove('selected'))}sectionButtons.forEach(b=>b.addEventListener('click',()=>{clearSection();b.classList.add('selected');section=b.textContent.trim();sectionField.value='';sync()}));barButtons.forEach(b=>b.addEventListener('click',()=>{clearBars();b.classList.add('selected');bars=b.textContent.trim();barsField.value='';sync()}));customSectionButton.addEventListener('click',()=>{clearSection();customSectionButton.classList.add('selected');section='custom';sync();setTimeout(()=>sectionField.focus(),120)});customBarsButton.addEventListener('click',()=>{clearBars();customBarsButton.classList.add('selected');bars='custom';sync();setTimeout(()=>barsField.focus(),120)});sectionField.addEventListener('input',sync);barsField.addEventListener('input',()=>{barsField.value=barsField.value.replace(/\D+/g,'');sync()});document.getElementById('cancelButton').addEventListener('click',()=>{toast.textContent='Cancelled';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)});addButton.addEventListener('click',()=>{if(addButton.disabled)return;const sectionName=section==='custom'?sectionField.value.trim():section,barCount=bars==='custom'?barsField.value:bars;toast.textContent=`Added ${sectionName} · ${barCount} bars`;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)});sync();
</script></body></html>
