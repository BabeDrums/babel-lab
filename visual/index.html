<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080a"><title>Babel Lab — FIRE Shell</title><style>
:root{color-scheme:dark;--bg:#08080a;--panel:#121215;--cell:#17171b;--sel:#29292f;--line:rgba(255,255,255,.09);--text:#f5f5f7;--muted:#9999a2}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}button,input,select{font:inherit;color:inherit}.shell{max-width:860px;min-height:100dvh;margin:auto;padding:max(20px,env(safe-area-inset-top)) 24px max(32px,env(safe-area-inset-bottom))}.labbar{height:42px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.labbar a{color:var(--text);text-decoration:none}.tabs{display:flex;gap:6px;overflow:auto;padding:8px 0 18px;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#101013;border-radius:999px;padding:8px 13px;color:var(--muted)}.tabs button.on{background:#eee;color:#111}.toolbar{height:52px;display:flex;justify-content:space-between;align-items:center}.icon{width:44px;height:44px;border:0;border-radius:13px;background:transparent;font-size:26px}.icon.action{border:1px solid var(--line);background:rgba(255,255,255,.025);font-size:22px}h1{font-size:46px;letter-spacing:-.045em;margin:8px 0 28px;line-height:1}.meta{color:var(--muted);margin:-20px 0 28px;font-size:14px}.group{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--panel);margin-bottom:18px}.row{min-height:66px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 20px;display:flex;align-items:center;justify-content:space-between;text-align:left}.row:last-child{border-bottom:0}.row strong{font-size:17px}.row small,.muted{color:var(--muted);font-size:14px}.rowcopy{display:flex;flex-direction:column;gap:3px}.mark{font-size:18px;color:#c8c8cf}.value{display:flex;gap:6px;align-items:center;color:#d7d7dc}.inline{width:72px;text-align:right;border:0;background:transparent;outline:none;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:18px}.tile{min-height:58px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);text-align:left;padding:0 18px;font-weight:620}.tile:nth-child(2n){border-right:0}.tile:nth-last-child(-n+2){border-bottom:0}.tile.on{background:var(--sel)}.primary{width:100%;min-height:52px;border:0;border-radius:15px;background:#eee;color:#111;font-weight:720;margin-top:8px}.stage-note{font-size:12px;color:#777780;text-align:center;margin-top:22px}.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.67);display:none}.backdrop.show{display:block}.sheetwrap{position:fixed;inset:0;display:none;place-items:center;padding:24px}.sheetwrap.show{display:grid}.sheet{width:min(620px,calc(100vw - 64px));max-height:84dvh;overflow:auto;background:#1a1a1e;border:1px solid rgba(255,255,255,.15);border-radius:26px;padding:24px;box-shadow:0 28px 80px rgba(0,0,0,.5)}.label{font-size:14px;font-weight:680;color:#b7b7bf;margin:0 2px 9px}.choices{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:15px;overflow:hidden}.choice{min-height:54px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#141417;text-align:left;padding:0 16px;font-weight:620}.choice:nth-child(2n){border-right:0}.choice:nth-last-child(-n+2){border-bottom:0}.choice.on{background:var(--sel)}.segments{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden}.seg{height:48px;border:0;border-right:1px solid var(--line);background:#141417;color:var(--muted)}.seg:last-child{border:0}.seg.on{background:var(--sel);color:#fff}.plus{font-size:22px}.field{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;background:#101013;padding:0 14px;margin-top:9px;display:none}.field.show{display:block}.sheetgroup+.sheetgroup{margin-top:21px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:23px}.actions button{height:50px;border-radius:14px;font-weight:700}.cancel{background:#222226;border:1px solid var(--line)}.add{background:#eee;color:#111;border:0}.project{position:relative}.project .row{padding-right:64px}.more{position:absolute;right:10px;top:11px;width:44px;height:44px;border:0;background:transparent;color:#bbb;font-size:18px}.hidden{display:none!important}@media(max-width:700px){.shell{padding-inline:18px}h1{font-size:40px}.sheetwrap{align-items:end;padding:0}.sheet{width:100%;max-height:89dvh;border-radius:28px 28px 0 0;border-left:0;border-right:0;border-bottom:0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}}
</style></head><body><main class="shell"><div class="labbar"><a href="../">‹ Babel Lab</a><span>·</span><span>Visual Lab · FIRE shell harness 01 · experimental</span></div><nav class="tabs" id="tabs"></nav><div id="app"></div><p class="stage-note">Fake state only · candidate shell evidence, never product authority</p></main><div class="backdrop" id="backdrop"></div><div class="sheetwrap" id="sheetwrap"></div><script>
const screens=['Projects','Home','Setup','Structure','Tracks'];let screen='Projects';let sections=[['Intro',8],['Verse',8],['Chorus',8]];let tracks=new Set(['Vocals','Drums']);let setup={reference:true,grid:false,listen:false};const app=document.getElementById('app'),tabs=document.getElementById('tabs'),backdrop=document.getElementById('backdrop'),wrap=document.getElementById('sheetwrap');
function header(title,right='',meta=''){return `<div class="toolbar"><button class="icon" data-back>${screen==='Projects'?'':'‹'}</button>${right?`<button class="icon action" data-action="${right}">${right==='manage'?'•••':'+'}</button>`:'<span></span>'}</div><h1>${title}</h1>${meta?`<p class="meta">${meta}</p>`:''}`}
function renderTabs(){tabs.innerHTML=screens.map(s=>`<button class="${s===screen?'on':''}" data-screen="${s}">${s}</button>`).join('')}
function render(){renderTabs();if(screen==='Projects')app.innerHTML=header('Projects','new-project')+`<div class="group"><div class="project"><button class="row" data-screen="Home"><span class="rowcopy"><strong>Smithereens</strong><small>Cover · Joji</small></span></button><button class="more">•••</button></div><div class="project"><button class="row"><span class="rowcopy"><strong>Still</strong><small>Original</small></span></button><button class="more">•••</button></div></div>`;if(screen==='Home')app.innerHTML=header('Smithereens','manage','Cover · Joji')+`<div class="group"><button class="row" data-screen="Setup"><strong>Setup</strong><span class="mark">✓</span></button><button class="row" data-screen="Structure"><strong>Structure</strong><span class="mark">→</span></button><button class="row" data-screen="Tracks"><strong>Tracks</strong><span class="mark">○</span></button></div>`;if(screen==='Setup')app.innerHTML=header('Setup')+`<div class="group"><button class="row" data-toggle="reference"><strong>Reference</strong><span class="mark">${setup.reference?'✓':'○'}</span></button><div class="row"><strong>Tempo</strong><span class="value"><input class="inline" inputmode="decimal" value="101"> BPM</span></div><div class="row"><strong>Meter</strong><span class="value">4/4</span></div><button class="row" data-toggle="grid"><strong>Grid</strong><span class="mark">${setup.grid?'✓':'○'}</span></button><button class="row" data-toggle="listen"><strong>Listen</strong><span class="mark">${setup.listen?'✓':'○'}</span></button></div>`;if(screen==='Structure')app.innerHTML=header('Structure','section')+`<div class="group">${sections.map((x,i)=>`<button class="row"><strong>${x[0]}</strong><span class="muted">${x[1]} bars &nbsp; ≡</span></button>`).join('')}</div><div class="group"><button class="row"><strong>Accurate</strong><span class="mark">○</span></button></div>`;if(screen==='Tracks'){let names=['Vocals','Drums','Bass','Guitar','Keys','Strings','Percussion','FX'];app.innerHTML=header('Tracks','track')+`<div class="grid">${names.map(n=>`<button class="tile ${tracks.has(n)?'on':''}" data-track="${n}">${n}</button>`).join('')}</div><button class="primary">Done</button>`}}
function openSheet(kind){backdrop.classList.add('show');wrap.classList.add('show');if(kind==='section')wrap.innerHTML=`<section class="sheet"><div class="sheetgroup"><div class="label">Section</div><div class="choices" id="types">${['Intro','Verse','Pre-Chorus','Chorus','Bridge','Instrumental','Outro'].map((n,i)=>`<button class="choice ${i===0?'on':''}" data-type="${n}">${n}</button>`).join('')}<button class="choice plus" data-custom-type>+</button></div><input class="field" id="customType" placeholder="Section"></div><div class="sheetgroup"><div class="label">Length</div><div class="segments" id="lengths">${[4,8,12,16].map(n=>`<button class="seg ${n===8?'on':''}" data-bars="${n}">${n}</button>`).join('')}<button class="seg plus" data-custom-bars>+</button></div><input class="field" id="customBars" inputmode="numeric" placeholder="Bars"></div><div class="actions"><button class="cancel" data-close>Cancel</button><button class="add" data-add-section>Add</button></div></section>`;else if(kind==='track')wrap.innerHTML=`<section class="sheet"><div class="label">Track</div><input class="field show" id="trackName" placeholder="Track" autofocus><div class="actions"><button class="cancel" data-close>Cancel</button><button class="add" data-add-track>Add</button></div></section>`;else wrap.innerHTML=`<section class="sheet"><div class="label">Project</div><input class="field show" placeholder="Title"><input class="field show" placeholder="Artist"><div class="actions"><button class="cancel" data-close>Cancel</button><button class="add" data-close>Add</button></div></section>`}
function closeSheet(){backdrop.classList.remove('show');wrap.classList.remove('show');wrap.innerHTML=''}
document.addEventListener('click',e=>{const s=e.target.closest('[data-screen]');if(s){screen=s.dataset.screen;render();return}if(e.target.closest('[data-back]')&&screen!=='Projects'){screen=screen==='Home'?'Projects':'Home';render();return}const a=e.target.closest('[data-action]');if(a){openSheet(a.dataset.action==='new-project'?'project':a.dataset.action);return}const t=e.target.closest('[data-toggle]');if(t){setup[t.dataset.toggle]=!setup[t.dataset.toggle];render();return}const tr=e.target.closest('[data-track]');if(tr){tracks.has(tr.dataset.track)?tracks.delete(tr.dataset.track):tracks.add(tr.dataset.track);render();return}if(e.target.closest('[data-close]')||e.target===backdrop){closeSheet();return}const type=e.target.closest('[data-type]');if(type){document.querySelectorAll('[data-type], [data-custom-type]').forEach(x=>x.classList.remove('on'));type.classList.add('on');document.getElementById('customType').classList.remove('show')}const bars=e.target.closest('[data-bars]');if(bars){document.querySelectorAll('[data-bars], [data-custom-bars]').forEach(x=>x.classList.remove('on'));bars.classList.add('on');document.getElementById('customBars').classList.remove('show')}if(e.target.closest('[data-custom-type]')){document.querySelectorAll('[data-type], [data-custom-type]').forEach(x=>x.classList.remove('on'));e.target.closest('[data-custom-type]').classList.add('on');document.getElementById('customType').classList.add('show').focus()}if(e.target.closest('[data-custom-bars]')){document.querySelectorAll('[data-bars], [data-custom-bars]').forEach(x=>x.classList.remove('on'));e.target.closest('[data-custom-bars]').classList.add('on');document.getElementById('customBars').classList.add('show').focus()}if(e.target.closest('[data-add-section]')){const custom=document.getElementById('customType'),customB=document.getElementById('customBars'),typeOn=document.querySelector('[data-type].on'),barOn=document.querySelector('[data-bars].on');const name=custom.classList.contains('show')?(custom.value.trim()||'Custom'):(typeOn?.dataset.type||'Intro');const barsN=customB.classList.contains('show')?(parseInt(customB.value)||8):(parseInt(barOn?.dataset.bars)||8);sections.push([name,barsN]);closeSheet();render()}if(e.target.closest('[data-add-track]')){const n=document.getElementById('trackName').value.trim();if(n)tracks.add(n);closeSheet();render()}});render();
</script></body></html>
